name: Docker Image CI

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: |
          docker build . \
            --file some_docker.Dockerfile \
            --tag some_docker:${{ github.sha }} \
            --tag some_docker:latest

      - name: Run built image
        run: docker run --rm some_docker
